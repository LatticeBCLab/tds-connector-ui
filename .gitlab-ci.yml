variables:
  PROJECT_NAME: "tds"
  IMAGE_NAME: "connector-ui"

stages:
  - build
  - deploy

.job_template: &job_configuration
  image:
    name: $CI_REGISTRY/library/kaniko-executor
    entrypoint: [ "" ]
  stage: build
  only:
    - main
    - develop
  script:
    - echo $TAG
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile ./Dockerfile.gitlab
      --destination $TAG
      --build-arg NEXT_PUBLIC_USER_DID=$USER_DID
      --build-arg NEXT_PUBLIC_CONNECTOR_DID=$CONNECTOR_DID
      --build-arg NEXT_PUBLIC_TERMINAL_DID=$TERMINAL_DID
      --build-arg NEXT_PUBLIC_LOCATION=$LOCATION
      --build-arg NEXT_PUBLIC_INBOUND_RESOURCE_DATASPACE_ID=$DATASPACE_ID

build-laos:
  variables:
    USER_DID: "did:tdsc:user:laos-001"
    CONNECTOR_DID: "did:tdsc:connector:laos-001"
    TERMINAL_DID: "did:tdsc:terminal:laos-001"
    LOCATION: "Laos"
    DATASPACE_ID: "cmf4tbxky0001njs14md4yc5a"
  before_script:
    - export TAG=$CI_REGISTRY/${PROJECT_NAME}/connector-laos:latest
  <<: *job_configuration

build-china-offshore:
  variables:
    USER_DID: "did:tdsc:user:laos-001"
    CONNECTOR_DID: "did:tdsc:connector:laos-custody-001"
    TERMINAL_DID: "did:tdsc:terminal:laos-custody-001"
    LOCATION: "China"
    DATASPACE_ID: "cmf4tbxky0001njs14md4yc5a"
  before_script:
    - export TAG=$CI_REGISTRY/${PROJECT_NAME}/connector-china-offshore:latest
  <<: *job_configuration

build-china:
  variables:
    USER_DID: "did:tdsc:user:china-asean-001"
    CONNECTOR_DID: "did:tdsc:connector:china-asean-001"
    TERMINAL_DID: "did:tdsc:terminal:china-asean-001"
    LOCATION: "China"
    DATASPACE_ID: "cmf4tbxky0001njs14md4yc5a"
  before_script:
    - export TAG=$CI_REGISTRY/${PROJECT_NAME}/connector-china:latest
  <<: *job_configuration

.deploy_template: &deploy_configuration
  image:
    name: $CI_REGISTRY/library/ubuntu:22.04
    entrypoint: [ '' ]
  stage: deploy
  script:
    - sed -i s@/archive.ubuntu.com/@/mirrors.cernet.edu.cn/@g /etc/apt/sources.list
    - sed -i s@/security.ubuntu.com/@/mirrors.cernet.edu.cn/@g /etc/apt/sources.list
    - apt update && apt install -y ansible sshpass
    - ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory.ini ansible/playbook.yml -v
    - apt clean

deploy-production:
  variables:
    DEPLOY_HOST: "$PROD_DEPLOY_HOST"
    DEPLOY_USER: "$PROD_DEPLOY_USER"
    DEPLOY_PASSWORD: "$PROD_DEPLOY_PASSWORD"
    CHINA_SERVICE_PATH: "$PROD_CHINA_SERVICE_PATH"
    LAOS_SERVICE_PATH: "$PROD_LAOS_SERVICE_PATH"
    CHINA_OFFSHORE_SERVICE_PATH: "$PROD_CHINA_OFFSHORE_SERVICE_PATH"
  before_script:
    - |
      sed -i "s/__PROD_DEPLOY_HOST__/${PROD_DEPLOY_HOST}/g" ansible/inventory.ini
      sed -i "s/__PROD_DEPLOY_USER__/${PROD_DEPLOY_USER}/g" ansible/inventory.ini
      sed -i "s/__PROD_DEPLOY_PASSWORD__/${PROD_DEPLOY_PASSWORD}/g" ansible/inventory.ini
      sed -i "s#__PROD_CHINA_SERVICE_PATH__#${PROD_CHINA_SERVICE_PATH}#g" ansible/inventory.ini
      sed -i "s#__PROD_LAOS_SERVICE_PATH__#${PROD_LAOS_SERVICE_PATH}#g" ansible/inventory.ini
      sed -i "s#__PROD_CHINA_OFFSHORE_SERVICE_PATH__#${PROD_CHINA_OFFSHORE_SERVICE_PATH}#g" ansible/inventory.ini

      sed -i "s/__DEPLOY_TARGET__/production/g" ansible/playbook.yml
  only:
    - main
  <<: *deploy_configuration

deploy-staging:
  variables:
    DEPLOY_HOST: "$STAGING_DEPLOY_HOST"
    DEPLOY_USER: "$STAGING_DEPLOY_USER"
    DEPLOY_PASSWORD: "$STAGING_DEPLOY_PASSWORD"
    CHINA_SERVICE_PATH: "$STAGING_CHINA_SERVICE_PATH"
    LAOS_SERVICE_PATH: "$STAGING_LAOS_SERVICE_PATH"
    CHINA_OFFSHORE_SERVICE_PATH: "$STAGING_CHINA_OFFSHORE_SERVICE_PATH"
  before_script:
    - |
      sed -i "s/__STAGING_DEPLOY_HOST__/${STAGING_DEPLOY_HOST}/g" ansible/inventory.ini
      sed -i "s/__STAGING_DEPLOY_USER__/${STAGING_DEPLOY_USER}/g" ansible/inventory.ini
      sed -i "s/__STAGING_DEPLOY_PASSWORD__/${STAGING_DEPLOY_PASSWORD}/g" ansible/inventory.ini
      sed -i "s#__STAGING_CHINA_SERVICE_PATH__#${STAGING_CHINA_SERVICE_PATH}#g" ansible/inventory.ini
      sed -i "s#__STAGING_LAOS_SERVICE_PATH__#${STAGING_LAOS_SERVICE_PATH}#g" ansible/inventory.ini
      sed -i "s#__STAGING_CHINA_OFFSHORE_SERVICE_PATH__#${STAGING_CHINA_OFFSHORE_SERVICE_PATH}#g" ansible/inventory.ini

      sed -i "s/__DEPLOY_TARGET__/staging/g" ansible/playbook.yml
  only:
    - develop
  <<: *deploy_configuration